name: Generate profile cards

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_profile_cards.py"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate profile cards and contribution reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_cards.py --username xiaoyumuxi --output-dir profile

      - name: Commit updated profile data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            profile/stats.svg \
            profile/top-langs.svg \
            profile/contribution-languages.md \
            profile/contribution-languages.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh profile data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
